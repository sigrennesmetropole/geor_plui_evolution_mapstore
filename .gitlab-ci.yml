# Pipeline variables
variables:
  MAVEN_CLI_OPTS: "-s .m2/settings.xml -Dmaven.repo.local=.m2/repository --batch-mode --errors --fail-at-end --show-version -DinstallAtEnd=true -DdeployAtEnd=true"
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository -Djava.awt.headless=true"
  MVN_ARGS: "-s /builds/rennes-metropole/plui-evolution/plui-evolution-front/.m2/settings.xml"
  MAVEN_CLI_OPTS_VERSION: "help:evaluate -Dexpression=project.version -q -DforceStdout"
  GIT_SUBMODULE_STRATEGY: recursive
  NODE_OPTIONS: "--max-old-space-size=8192"

# Cache policy - Share target folders between jobs - Note that key is related to a commit and is purged automatically after pipeline execution
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - $CI_PROJECT_DIR/.m2/repository/**/*
    - $CI_PROJECT_DIR/**/target/**/*

include:
  - component: $CI_SERVER_FQDN/boost/ci-component/security/dependency-track@~latest
  - component: $CI_SERVER_FQDN/boost/ci-component/security/cdxgen-sbom@~latest   
    inputs:
      exclude_paths: "MapStore2"


default:
  image: maven:3.9.9-eclipse-temurin-17
  before_script:
    - apt update && apt install -y gettext-base build-essential
    - envsubst '${MVN_GROUP} ${MVN_RELEASE} ${MVN_SNAPSHOTS}' < pom.xml > pom.subst && mv -f pom.subst pom.xml

# Stages definition
stages:
  - build
  - test
  - sast
  - post_sast  
  - deploy
  - delivering

# Build job with maven plugin execution policies define in parent pom
pluievolutionfront:build:
  script:
    - mvn help:evaluate -Dexpression=project.version $MAVEN_CLI_OPTS
    - PROJET_VERSION=$(mvn $MAVEN_CLI_OPTS_VERSION $MAVEN_CLI_OPTS)
    - echo "PROJET_VERSION=$PROJET_VERSION" >> build.env
    - echo $PROJET_VERSION
    - mvn $MAVEN_CLI_OPTS -U package -Pprod
  stage: build
  except:
    refs:
      - master
      - open/master
  artifacts:
    paths:
      - $CI_PROJECT_DIR/dist/PluiEvolutionExtension.zip
      - '**/target/'
      
pluievolutionfront:build:master:
  script:
    - PROJET_VERSION=$(mvn $MAVEN_CLI_OPTS_VERSION)
    - echo "PROJET_VERSION=$PROJET_VERSION" >> build.env
    - echo $PROJET_VERSION
    - mvn $MAVEN_CLI_OPTS -U package -DskipTests -Pprod 
  stage: build
  only:
    refs:
      - master
      - open/master   
  artifacts:
    paths:
      - $CI_PROJECT_DIR/dist/PluiEvolutionExtension.zip

# Sonar code quality analysis - note a full test coverage report through a jacoco.exec merged file in base project folder
pluievolutionfront:sonar:
  stage: test
  image: maven:3.9.9-eclipse-temurin-17
  dependencies:
    - pluievolutionfront:build
  except:
    refs:
      - master
      - open/master
  allow_failure: true
  script:
    - >
      mvn $MAVEN_CLI_OPTS -U compile sonar:sonar
      -Dsonar.host.url=$SONAR_URL
      -Dsonar.login=$SONAR_TOKEN
      -Dsonar.gitlab.commit_sha=$CI_COMMIT_SHA
      -Dsonar.gitlab.ref_name=$CI_COMMIT_REF_NAME
      -Dsonar.gitlab.project_id=$CI_PROJECT_ID
      -Dsonar.branch.name=$CI_COMMIT_REF_NAME
            

# On master, do not use branch parameter
pluievolutionfront:sonar:master:
  stage: test
  image: maven:3.9.9-eclipse-temurin-17
  dependencies:
    - pluievolutionfront:build
  only:
    refs:
      - open/master
  allow_failure: true
  script:
    - >
      mvn $MAVEN_CLI_OPTS -U compile sonar:sonar
      -Dsonar.host.url=$SONAR_URL
      -Dsonar.login=$SONAR_TOKEN
      -Dsonar.gitlab.commit_sha=$CI_COMMIT_SHA
      -Dsonar.gitlab.ref_name=$CI_COMMIT_REF_NAME
      -Dsonar.gitlab.project_id=$CI_PROJECT_ID      

## Livraison Github
push-to-github:
  stage: delivering
  image: maven:3.9.9-eclipse-temurin-17
  dependencies:
    - pluievolutionfront:build
  rules:
    - if: '$CI_COMMIT_TAG'
      when: manual
  before_script:
    - apt update && apt install -y gettext-base
    - envsubst '${MVN_GROUP} ${MVN_RELEASE} ${MVN_SNAPSHOTS}' < pom.xml > pom.subst && mv -f pom.subst pom.xml
  script:
    - cd ci
    - apt install -y rsync
    - chmod +x push-to-github.sh
    - ./push-to-github.sh
  variables:
    SOURCE_REPOSITORY: $CI_PROJECT_DIR
    # Les variables GITHUB_RM_ACCOUNT, GITHUB_RM_LOGIN et GIT_TOKEN sont à définir manuellement avant de lancer le job
    GIT_REMOTE: "https://$GITHUB_RM_ACCOUNT:$GIT_TOKEN@github.com/sigrennesmetropole/geor_plui_evolution_mapstore.git"
    COMMIT_MESSAGE: $GITHUB_COMMIT_MESSAGE